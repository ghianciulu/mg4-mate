services:
  mg4-mate:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_FROM: python:3.12-slim
    ports:
      - "4000:4000"
    volumes:
      - ./data:/data            # persistent DB only (code is baked into the image)
    environment:
      - DB_PATH=/data/mg4_mate.db
      # Optional MG4/Home Assistant source:
      # - VEHICLE_SOURCE=homeassistant
      # - HA_URL=https://your-home-assistant.example
      # - HA_TOKEN=your-long-lived-access-token
      # - HA_ENTITY_PREFIX=lsjwh4097rn111393
    restart: unless-stopped
