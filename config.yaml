name: "MG4 Mate"
description: "Trip tracking, charge logging and statistics for MG4 via Home Assistant"
version: "1.0.0"
slug: "mg4_mate"
url: "https://github.com/ghianciulu/mg4-mate"
init: false
startup: "application"
boot: "auto"
homeassistant: "2024.1.0"

arch:
  - aarch64
  - amd64
  - armv7

map:
  - type: data
    read_only: false

ingress: true
ingress_port: 4000
panel_icon: "mdi:car-electric"
panel_title: "MG4 Mate"

ports:
  4000/tcp: null
ports_description:
  4000/tcp: "Web UI (not needed with ingress)"

options:
  log_level: "info"
  VEHICLE_SOURCE: "homeassistant"
  HA_URL: ""
  HA_TOKEN: ""
  HA_ENTITY_PREFIX: ""

schema:
  log_level: "list(trace|debug|info|warning|error|critical)"
  VEHICLE_SOURCE: "list(homeassistant)"
  HA_URL: "str?"
  HA_TOKEN: "password?"
  HA_ENTITY_PREFIX: "str?"
