# saic_gateway_commute_boost.yaml
#
# PROBLEMA RISOLTO
# Il SAIC MQTT Gateway ha gateway_inactive_refresh_period = 86400s (24 ore).
# Quando la macchina è ferma/dormiente, il gateway interroga la SAIC cloud API
# solo una volta al giorno. Al mattino, se l'auto parte prima del prossimo
# ciclo di polling, il gateway non vede mai vehicle_running = on e MG4 Mate
# non riceve l'evento di avvio viaggio.
#
# SOLUZIONE
# Durante le fasce orarie pendolari abbassa il periodo a 30s.
# Fuori fascia ripristina a 3600s (1h) — comunque molto meglio del default 24h.
#
# INSTALLAZIONE IN HOME ASSISTANT
#   Opzione A — Editor visuale:
#     Impostazioni → Automazioni → Crea automazione → Modifica YAML
#     Incolla il contenuto sotto (dalla riga "alias:" in poi).
#
#   Opzione B — File YAML:
#     1. Copia questo file in <config_ha>/automations/
#     2. In configuration.yaml: automation: !include_dir_merge_list automations/
#     3. Riavvia HA o usa Strumenti sviluppatore → YAML → Ricarica automazioni.
#
# PERSONALIZZAZIONE
#   - Adatta gli orari ai tuoi spostamenti (07:30 / 09:30 / 17:00 / 20:00).
#   - Il prefisso "lsjwh4097rn111393" è specifico del tuo veicolo: non cambiare.
#   - "value: 30" = 30 secondi durante fascia attiva.
#   - "value: 3600" = 1 ora fuori fascia (puoi alzarlo se vuoi).

alias: "MG4 - Gateway commute boost"
description: >
  Abbassa gateway_inactive_refresh_period a 30s durante le fasce pendolari
  (lun-ven 07:30–09:30 e 17:00–20:00) per evitare viaggi mancati.
  Ripristina a 3600s fuori fascia.
mode: single
max_exceeded: silent

trigger:
  - platform: time
    at: "07:30:00"
    id: morning_on
  - platform: time
    at: "09:30:00"
    id: morning_off
  - platform: time
    at: "17:00:00"
    id: evening_on
  - platform: time
    at: "20:00:00"
    id: evening_off

condition:
  - condition: time
    weekday:
      - mon
      - tue
      - wed
      - thu
      - fri

action:
  - if:
      - condition: template
        value_template: "{{ trigger.id in ['morning_on', 'evening_on'] }}"
    then:
      - service: number.set_value
        target:
          entity_id: number.lsjwh4097rn111393_gateway_inactive_refresh_period
        data:
          value: 30
      - service: logbook.log
        data:
          name: "MG4 Gateway"
          message: "Commute boost ON — polling ogni 30s (fascia pendolare attiva)"
    else:
      - service: number.set_value
        target:
          entity_id: number.lsjwh4097rn111393_gateway_inactive_refresh_period
        data:
          value: 3600
      - service: logbook.log
        data:
          name: "MG4 Gateway"
          message: "Commute boost OFF — polling ogni 3600s"
